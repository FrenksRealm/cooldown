<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COOLDOWN</title>
  <meta name="description" content="COOLDOWN is where cyclists and bike mechanics show off their bikes, builds and workstations, put their season goals and races in public, and get scouted by sponsors.">
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="assets/video/poster.jpg" as="image">
  <meta name="color-scheme" content="light">

  <meta property="og:title" content="COOLDOWN">
  <meta property="og:description" content="Bikes, builds, goals and races for riders and mechanics. Cool down here. Get seen by the brands that matter.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="icon" id="tabIcon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <!-- Headlines: Bricolage Grotesque (self-hosted in assets/fonts). Body: General Sans. -->
  <link rel="preload" href="assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- chrome finish shared by every water drop on the page -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="cdChrome" x1=".2" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".2" stop-color="#dfe7f2"/>
        <stop offset=".4" stop-color="#93a3ba"/>
        <stop offset=".5" stop-color="#1c2a44"/>
        <stop offset=".56" stop-color="#3d5f96"/>
        <stop offset=".66" stop-color="#d6e3f5"/>
        <stop offset=".78" stop-color="#ffffff"/>
        <stop offset=".9" stop-color="#a9bbd4"/>
        <stop offset="1" stop-color="#55657e"/>
      </linearGradient>
      <linearGradient id="cdSheen" x1="0" y1="0" x2="1" y2=".35">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;-1 0;1 0" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="gnav" id="gnav">
    <div class="gnav-in">
      <a class="logo spin" id="logo" href="#/" aria-label="COOLDOWN home"><span class="logo-word"><i style="--i:0">C</i><i style="--i:1">O</i><i style="--i:2">O</i><i style="--i:3">L</i><i style="--i:4">D</i><i style="--i:5">O</i><i style="--i:6">W</i><i style="--i:7">N</i></span><svg class="logo-drop" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1.5C12 1.5 3 13.2 3 20.3a9 9 0 0 0 18 0C21 13.2 12 1.5 12 1.5Z"/><path class="sheen" d="M12 1.5C12 1.5 3 13.2 3 20.3a9 9 0 0 0 18 0C21 13.2 12 1.5 12 1.5Z"/><ellipse class="hl" cx="8.3" cy="20.6" rx="2.1" ry="3.4" transform="rotate(-18 8.3 20.6)"/></svg></a>
      <nav class="gnav-links" aria-label="Main">
        <a href="#/" data-view="home">Home</a>
        <a href="#/rigs" data-view="rigs">Rigs</a>
        <a href="#/athletes" data-view="athletes">Athletes</a>
        <a href="#/scout" data-view="scout">Scout</a>
        <a href="#/journal" data-view="journal">Journal</a>
      </nav>
      <div class="gnav-actions">
        <button class="icon-btn ghost" id="searchBtn" type="button" aria-label="Search (Command K)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
        <button class="me-btn" id="meBtn" type="button" aria-label="Your profile"></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main (mobile)">
    <a href="#/" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/rigs" data-view="rigs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l5-8h5l2 8M11 8l2 8"/></svg>Rigs</a>
    <a href="#/athletes" data-view="athletes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Athletes</a>
    <a href="#/journal" data-view="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM9 10h6M9 14h6"/></svg>Journal</a>
    <button type="button" class="tab-me" id="tabMe" aria-label="Your profile"><span class="tab-me-av" id="tabMeAv"></span>Profile</button>
  </nav>

  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><div class="noscript">COOLDOWN needs JavaScript turned on.</div></noscript>

  <script src="js/tabicon.js" defer></script>
  <script src="js/clips.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/avatar.js" defer></script>
  <script src="js/art.js" defer></script>
  <script type="module" src="js/avatar3d.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
